name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -E '^const Version = ' rosetta.go | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$declared" ]; then
            echo "tag v$tag does not match rosetta.Version $declared"; exit 1
          fi
      - name: Verify CHANGELOG has an entry
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $1 == "##" && $2 == tag { count++ }
            END { exit count != 1 }
          ' CHANGELOG.md || { echo "Expected one CHANGELOG heading for $GITHUB_REF_NAME"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v tag="$GITHUB_REF_NAME" '
            $1 == "##" && $2 == tag { found=1; next }
            found && $1 == "##" { exit }
            found { print }
          ' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
